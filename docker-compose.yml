version: "3.8"

services:
  # Fluent Bit container
  fluent-bit:
    image: cr.fluentbit.io/fluent/fluent-bit:latest
    container_name: fluent-bit
    restart: unless-stopped
    ports:
      # Health check & metrics
      - "2020:2020"
      # Log forward input (Docker logging driver)
      - "24224:24224"
      - "24224:24224/udp"
      # Direct HTTP log input to Fluent Bit
      - "8888:8888"
    volumes:
      - ./fluent-bit/linux.conf:/fluent-bit/etc/fluent-bit.conf:ro
    extra_hosts:
      # Ensures Linux Docker can also resolve host.docker.internal
      - "host.docker.internal:host-gateway"
