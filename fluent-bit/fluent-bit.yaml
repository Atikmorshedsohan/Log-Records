service:
  flush: 5
  log_level: info
  storage.path: C:/fluent-bit/storage

pipeline:
  inputs:
    - name: winlog
      channels: System,Application,Security
      interval_sec: 1
      db: C:/fluent-bit/winlog.db
      tag: windows.events

  filters:
    - name: record_modifier
      match: windows.*
      records:
        os_type: windows
        hostname: my-windows-pc

  outputs:
    - name: http
      match: windows.*
      host: 127.0.0.1  # Change to host.docker.internal if Fluent Bit runs in Docker
      port: 8000
      uri: /ingest
      format: json_lines
      tls: off
      headers:
        - "X-Collector-Token: YOUR_COLLECTOR_TOKEN"
