service:
  flush: 5
  log_level: info

pipeline:
  inputs:
    - name: winlog
      channels: System,Application
      interval_sec: 1
      db: winlog.db
      tag: windows.events

  filters:
    - name: record_modifier
      match: windows.*
      records:
        os_type: windows
        hostname: my-windows-pc

  outputs:
    - name: http
      match: windows.*
      host: 127.0.0.1
      port: 8000
      uri: /ingest
      format: json_lines
      tls: off

