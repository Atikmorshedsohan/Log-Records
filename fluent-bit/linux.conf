[SERVICE]
    Flush        5
    Log_Level    info

# Collect Linux Systemd Journal logs (kernel, services, security, authentication)
[INPUT]
    Name            systemd
    Tag             linux.events
    DB              /var/log/fluent-bit-systemd.db
    Read_From_Tail  On

# Attach metadata tags
[FILTER]
    Name          record_modifier
    Match         linux.*
    Record        os_type linux

# Forward to FastAPI backend via HTTP POST
[OUTPUT]
    Name           http
    Match          linux.*
    # Use 127.0.0.1 if backend runs on same machine, or your server's IP if remote
    Host           127.0.0.1
    Port           8000
    URI            /ingest
    Format         json_lines
    tls            Off
