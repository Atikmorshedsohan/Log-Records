[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    # Built-in HTTP monitoring & health check server
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2020

# 1. Collect Linux Systemd Journal logs (when mounted)
[INPUT]
    Name            systemd
    Tag             host.systemd
    Read_From_Tail  On

# 2. Forward Input Port (allows Docker logging driver or agents to stream logs on port 24224)
[INPUT]
    Name            forward
    Listen          0.0.0.0
    Port            24224

# 3. HTTP Ingestion Port (allows pushing logs to Fluent Bit via HTTP POST on port 8888)
[INPUT]
    Name            http
    Listen          0.0.0.0
    Port            8888

# Output logs via HTTP POST to FastAPI backend
[OUTPUT]
    Name         http
    Match        *
    # When running Fluent Bit in Docker on Windows/Mac, use host.docker.internal to reach FastAPI on your PC
    # If running both locally without Docker, use 127.0.0.1
    Host         host.docker.internal
    Port         8000
    URI          /api/logs
    Format       json
    Header       Content-Type application/json


