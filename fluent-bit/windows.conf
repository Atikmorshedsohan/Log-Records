[SERVICE]
    Flush        5
    Log_Level    info
    storage.path C:/fluent-bit/storage

[INPUT]
    Name          winlog
    Channels      System,Application,Security
    Interval_Sec  1
    DB            C:/fluent-bit/winlog.db
    Tag           windows.events

[FILTER]
    Name          record_modifier
    Match         windows.*
    Record        os_type windows
    Record        hostname my-windows-pc

[OUTPUT]
    Name           http
    Match          windows.*
    Host           127.0.0.1
    Port           8000
    URI            /ingest
    Format         json_lines
    Header         X-Collector-Token YOUR_COLLECTOR_TOKEN
    tls            Off
