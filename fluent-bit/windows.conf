[SERVICE]
    Flush        5
    Log_Level    info

[INPUT]
    Name           winlog
    Channels       System,Application
    Interval_Sec   1
    DB             winlog.db
    Tag            windows.events

[FILTER]
    Name          record_modifier
    Match         windows.*
    Record        os_type windows
    Record        hostname my-windows-pc

[OUTPUT]
    Name           http
    Match          windows.*
    Host           127.0.0.1
    Port           8000
    URI            /ingest
    Format         json_lines
    tls            Off

